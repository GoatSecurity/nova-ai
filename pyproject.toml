[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-ai"
version = "1.0.0"
description = "Advanced Local AI Agent & Desktop Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NOVA Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.0",
    "websockets>=12.0",
    "psutil>=6.0.0",
    "cryptography>=42.0.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
